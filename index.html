<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日本語">
<title>日本語</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script type="module">
import{S,$,start,quiz,w,unhide,save}from"./app.js";
import{D}from"./data.js";import{G}from"./grammar.js";
const m=$("m"),all=()=>D.concat(S.mine),back='<a class="btn alt" href="#">Home</a>';
function vocab(){
 m.innerHTML=back+`<h1>Vocabulary</h1><div class="card"><input id="a" placeholder="日本語"><input id="b" placeholder="ふりがな"><input id="c" placeholder="English"><button id="add">Add word</button></div><div class="card">${all().length} words, ${S.hidden.length} hidden</div>`+(S.hidden.length?`<div class="card">Hidden words (tap to bring back)${S.hidden.map(x=>`<button class="alt" data-u="${x}">${x}</button>`).join("")}</div>`:"");
 $("add").onclick=async()=>{const v=[$("a").value.trim(),$("b").value.trim(),$("c").value.trim()];if(v.includes(""))return;S.mine.push(v);await save("mine",S.mine);vocab()};
 m.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{await unhide(b.dataset.u);vocab()});
}
function qz(){
 const p=all(),items=p.map(([j,r,e])=>({id:j,q:w(j,r,j),a:e,c:[e,...p.filter(x=>x[2]!==e).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[2])]}));
 m.innerHTML=back+'<h1>Quiz</h1><div class="card">Tap a word to see its reading. Double-tap a word you know to remove it for good.</div><div id="q"></div>';
 quiz($("q"),items);
}
function view(){
 const h=location.hash;
 if(h==="#grammar")m.innerHTML=back+"<h1>Grammar</h1>"+G.map(g=>`<a class="btn alt" href="${g.f}">${g.t}</a>`).join("");
 else if(h==="#vocab")vocab();else if(h==="#quiz")qz();
 else m.innerHTML='<h1>日本語</h1><a class="btn" href="#grammar">Grammar</a><a class="btn" href="#vocab">Vocabulary</a><a class="btn" href="#quiz">Quiz</a>';
}
start(()=>{view();addEventListener("hashchange",view)});
</script></body></html>
